<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradeSense AI - Trading Agent & Market Research</title>
    <meta name="description" content="Autonomous AI trading agent and research terminal for the Indian stock market (NSE/BSE) and Groww, featuring real-time small-to-large cap stock analysis, news catalysts, trade vs. avoid verdicts, backtesting, and paper execution." />
    <meta property="og:title" content="TradeSense AI - Trading Agent & Market Research" />
    <meta property="og:description" content="Autonomous AI trading agent and research terminal for the Indian stock market (NSE/BSE) and Groww, featuring real-time small-to-large cap stock analysis, news catalysts, trade vs. avoid verdicts, backtesting, and paper execution." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Early theme detection to prevent flash of wrong theme (FOUC)
      (function() {
        try {
          var saved = localStorage.getItem('tradesense_theme_mode');
          var isDark = true;
          if (saved === 'light') {
            isDark = false;
          } else if (saved === 'dark') {
            isDark = true;
          } else {
            isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var theme = isDark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.add(theme);
        } catch (e) {}
      })();

      // Gracefully ignore WebSocket / Vite HMR disconnection errors in cloud preview
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event.reason &&
          (typeof event.reason.message === 'string' &&
            (event.reason.message.includes('WebSocket') ||
             event.reason.message.includes('vite:ws')))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           (event.filename && event.filename.includes('@vite/client')))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased font-sans selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
